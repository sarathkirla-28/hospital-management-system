services:
  - type: web
    name: hospital-management-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hospital-management-db
          property: connectionString

databases:
  - name: hospital-management-db
    databaseName: hospital_db
    user: hospital_user
    plan: free
